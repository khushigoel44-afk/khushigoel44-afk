name: Generate trophy card

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day (Fixed cron syntax)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        # Using the official, stable master branch that handles modern environments properly
        uses: ryo-ma/github-profile-trophy@master
        with:
          SCREEN_NAME: ${{ github.repository_owner }}
          FIELD: dist/trophy.svg
          RESPONSE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: dracula
          MAX_COLS: -1
          MAX_ROWS: 1
          MARGIN_W: 8
          MARGIN_H: 8
          NO_BG: false
          NO_FRAME: false

      - name: Push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
