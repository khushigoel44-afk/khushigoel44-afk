name: Generate Pacman Contribution Graph

on:
  # Runs automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  # Allows manually triggering the run from the Actions tab
  workflow_dispatch:
  # Runs every time you push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate pacman animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: khushigoel44-afk
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
          
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}